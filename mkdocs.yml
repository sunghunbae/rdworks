site_name: rdworks
site_description: Chained Workflows built on RDKit
site_author: SungHun Bae
repo_url: https://github.com/sunghunbae/rdworks
repo_name: GitHub

theme:
    name: material
    features:
        - navigation.tabs
        - navigation.sections
        # - navigation.top
        # - navigation.footer
        - toc.integrate
        - search.highlight
        - search.suggest
        - search.share
        - content.code.select
        - content.code.copy
        
plugins:
    - search
    - mkdocstrings:
        default_handler: python
        handlers:
            python:
                paths: [src]
                options:
                    docstring_style: google
                    filters: ["!^_"]
                    heading_level: 2
                    docstring_section_style: list
                    group_by_category: true
                    show_category_heading: true
                    show_if_no_docstring: true
                    show_root_heading: true
                    show_source: true
                    show_docstring_attributes: true
                    show_docstring_functions: true
                    show_docstring_description: true
                    show_signature: true
                    show_docstring_examples: true
                    show_symbol_type_heading: true
                    show_symbol_type_toc: false

markdown_extensions:
    - admonition
    - codehilite
    - footnotes
    - toc:
        permalink: true
    - pymdownx.superfences
    - pymdownx.tabbed
    - pymdownx.snippets
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.highlight:
        anchor_linenums: true
        linenums_style: pymdownx-inline

nav:
    - Getting Started: index.md
    - Library: 'mollibr.md'
    - Molecule: 'mol.md'
    - Conformer: 'conf.md'
    - Torsion: 'torsion.md'
    - Microstate: 'microstate.md'
    - Complete: 'complete.md'
    - Scaffold: 'scaffold.md'
    - Utils: 'utils.md'

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js